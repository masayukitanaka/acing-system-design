<p class="c9"><span class="c2 c13">各ユーザーは自分自身のメッセージのみを検索できます。各クライアントに逆インデックスを構築せず、テキストメッセージ内で直接検索することを実装でき、逆インデックスの設計・実装・保守のコストを避けられます。平均的なクライアントのメッセージのストレージサイズは、おそらく1 GBよりはるかに少なくなります（メディアファイルを除く）。これらのメッセージをメモリにロードして検索するのは容易です。</span></p>
<p class="c4"><span class="c2 c13">メディアファイル名は検索できますが、ファイル自体の内容は検索しません。バイト列の検索は本書の範囲外です。</span></p>
