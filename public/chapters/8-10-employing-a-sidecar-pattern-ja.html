<p class="c9"><span class="c2">これでサイドカーパターンをレート制限ポリシーに適用する議論にたどり着きました。図1.8は、サイドカーパターンを使ったレート制限サービスのアーキテクチャを示しています。1.4.6節で議論したように、管理者はコントロールプレーンでユーザーサービスのレート制限ポリシーを設定でき、コントロールプレーンはそれらをサイドカーホストに配布します。ユーザーサービスがレート制限ポリシーをサイドカーホストに持つこの設計では、ユーザーサービスホストはレート制限ポリシーを検索するためにレート制限サービスにリクエストを行う必要がなく、これらのリクエストのネットワークオーバーヘッドを節約できます。</span></p>
