<p class="c4"><span class="c2 c13">2.5節で議論した内容に加えて、以下の項目についてもモニタリングとアラートを送るべきです。</span></p>
<p class="c9"><span class="c2 c13">共有バッチETLプラットフォームは、すでにロギング、モニタリング、アラートのシステムと統合されているはずです。ロールアップジョブ内のどのタスクでも、異常に長い実行時間や失敗があればアラートが送られます。</span></p>
<p class="c9"><span class="c2 c13">ロールアップタスクはHDFSテーブルに書き込みます。第10章で説明したデータ品質モニタリングツールを使って、無効なデータポイントを検出してアラートを発せます。</span></p>
