<p class="c9"><span class="c2">バックエンドは、メール送信のために共有のメールサービスにリクエストを送ることができます。</span></p>
<p class="c4"><span class="c2">投稿が7日経過したときに投稿者へ更新リマインダーを送るには、SQLデータベースに対して7日経過した投稿を問い合わせ、各投稿について送信をメールサービスに依頼する、というバッチETLジョブとして実装できます。</span></p>
<p class="c4"><span class="c2">他のアプリの通知サービスには、予測不可能なトラフィックスパイクへの対処、低レイテンシ、通知が短時間で配信されることといった要件がある場合があります。そのような通知サービスについては次章で議論します。</span></p>
