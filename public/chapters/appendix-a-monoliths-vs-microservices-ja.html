<p class="c4"><span class="c2 c13">本付録はモノリスとマイクロサービスを比較評価します。著者の個人的経験では、多くの情報源がモノリスアーキテクチャに対するマイクロサービスの利点を説明している一方、トレードオフは議論していないように感じられます。そこでここでそれらを議論します。本書では「サービス」と「マイクロサービス」という用語を交換可能に使います。</span></p>
<p class="c9"><span class="c0">マイクロサービスアーキテクチャ</span><span class="c1">は、ソフトウェアシステムを疎結合で独立に開発・デプロイ・スケールされるサービスの集合として構築することについてです。</span><span class="c0">モノリス</span><span class="c2 c13">は単一のユニットとして設計・開発・デプロイされます。</span></p>
