<p class="c9"><span class="c2">図7.7を参照すると、CDNの利用も検討できます。ただし、Craigslistは全ユーザーに表示される静的メディア（画像や動画）がほとんどありません。Craigslistが持つ静的コンテンツはCSSとJavaScriptのファイルで、合計でも数MBに過ぎません。CSSおよびJavaScriptファイルにはブラウザキャッシュも利用できます。（ブラウザキャッシュは4.10節で議論しました。）</span></p>
